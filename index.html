<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简阅 · by Tim-CN</Time></title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        (function() {
            if (/Mobi|Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent) || window.innerWidth <= 680) {
                window.location.replace('mobile/');
            }
        })();
    </script>
</head>
<body>
<div class="app">
    <div class="toolbar">
        <div class="logo"><i class="fas fa-book-open"></i>简阅</div>
        <button class="btn-icon" id="cloudLibraryBtn" title="云端图书馆"><i class="fas fa-cloud"></i> 云图书</button>
        <button class="btn-icon" id="myLibraryBtn" title="我的书库" style="display:none;"><i class="fas fa-archive"></i> 我的</button>
        <label class="file-label" id="uploadLocalLabel">
            <i class="fas fa-upload"></i><span> 上传</span>
            <input type="file" id="fileInput" accept=".epub,.pdf,.txt" style="display: none;">
        </label>
        <div class="search-bar" id="searchBar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="搜索全书..." autocomplete="off">
            <button id="clearSearchBtn" class="btn-icon" style="display:none;"><i class="fas fa-times"></i></button>
            <div class="search-results-dropdown" id="searchDropdown" style="display:none;">
                <div class="search-section local"><h4>📌 本页匹配</h4><ul id="localMatchList"></ul></div>
                <div class="search-section global"><h4>🌐 全文匹配</h4><ul id="globalMatchList"></ul></div>
            </div>
        </div>
        <button class="btn-icon" id="urlLoadBtn" title="打开远程图书"><i class="fas fa-link"></i></button>
        <div class="url-panel" id="urlPanel" style="display:none;">
            <input type="text" id="bookUrl" placeholder="图书URL (.epub/.pdf/.txt)">
            <button id="loadUrlBtn">加载</button>
            <button id="closeUrlPanelBtn"><i class="fas fa-times"></i></button>
        </div>
        <div class="ctrl-group">
            <button class="btn-icon" id="fontMinusBtn" title="减小字号"><i class="fas fa-font"></i><span>-</span></button>
            <button class="btn-icon" id="fontPlusBtn" title="增大字号"><i class="fas fa-font"></i><span>+</span></button>
            <button class="btn-icon" id="themeToggleBtn" title="日夜模式"><i class="fas fa-moon"></i></button>
            <button class="btn-icon" id="smartChapterBtn" title="智能章节(TXT)"><i class="fas fa-code-branch"></i></button>
            <button class="btn-icon" id="toggleSidebarBtn" title="目录"><i class="fas fa-list-ul"></i></button>
        </div>
        <div class="user-area" id="userArea">
            <button id="authBtn" class="btn-icon"><i class="fas fa-user"></i> 登录</button>
        </div>
    </div>

    <div class="main-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><i class="fas fa-table-of-contents"></i> 目录 / 章节</div>
            <ul class="toc-list" id="tocList"><li style="padding:20px;text-align:center;color:gray;">暂无书籍，上传后显示目录</li></ul>
        </aside>
        <div class="reader-container" id="readerContainer">
            <div id="readerArea" class="reader-area-inner">
                <div class="empty-state">
                    <i class="fas fa-cloud-upload-alt" style="font-size:48px;opacity:0.5;"></i>
                    <p style="margin-top:16px;">支持 EPUB / PDF / TXT<br>拖拽或点击上传，大文本智能分章</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="chapterNavBar" class="chapter-nav">
    <button id="prevChapterBtn"><i class="fas fa-chevron-left"></i></button>
    <span id="chapterTitle">章节标题</span>
    <button id="nextChapterBtn"><i class="fas fa-chevron-right"></i></button>
</div>
<div id="loadingToast" class="loading-overlay" style="display:none;">加载中...</div>

<!-- 登录/注册弹窗 -->
<div id="authModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <h3 id="authModalTitle">登录</h3>
        <input type="email" id="authEmail" placeholder="邮箱">
        <input type="password" id="authPassword" placeholder="密码（至少6位）">
        <div style="margin-top:12px;">
            <button id="authSubmitBtn" class="btn-icon" style="background:#3b82f6;color:white;">登录</button>
            <button id="authSwitchBtn" class="btn-icon">没有账号？去注册</button>
            <button id="authCloseBtn" class="btn-icon">取消</button>
        </div>
        <p id="authMsg" style="color:red;font-size:0.8rem;margin-top:8px;"></p>
    </div>
</div>

<!-- 上传至云端弹窗 -->
<div id="uploadModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <h3>上传到云端</h3>
        <p>将书籍保存到个人书库（私人），并可选择公开分享。</p>
        <div class="form-row">
            <input type="checkbox" id="makePublicCheck"> 允许公开此图书（其他用户可阅读）
        </div>
        <button id="confirmUploadBtn">上传</button>
        <button id="cancelUploadBtn">取消</button>
    </div>
</div>

<!-- 云端图书馆面板 -->
<div id="cloudPanel" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="width:90%; max-width:600px; max-height:80vh; overflow-y:auto;">
        <h3>📚 云端图书馆</h3>
        <div style="display:flex;gap:8px;margin-bottom:12px;">
            <input type="text" id="cloudSearchInput" placeholder="搜索书名..." style="flex:1">
            <select id="cloudTypeFilter">
                <option value="all">全部</option>
                <option value="official">官方图书</option>
                <option value="public">用户公开</option>
            </select>
        </div>
        <ul class="book-list" id="cloudBookList"></ul>
        <button id="closeCloudPanelBtn" style="margin-top:12px;">关闭</button>
    </div>
</div>

<!-- 我的书库面板 -->
<div id="myLibraryPanel" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="width:90%; max-width:600px; max-height:80vh; overflow-y:auto;">
        <h3>📖 我的书库（总大小: <span id="storageUsed">0</span> / 64 MB）</h3>
        <ul class="book-list" id="myBookList"></ul>
        <button id="closeMyLibraryBtn" style="margin-top:12px;">关闭</button>
    </div>
</div>

<!-- Supabase SDK -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
