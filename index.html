<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ZZX · 电子书阅读器</title>
    <!-- 外部样式 -->
    <link rel="stylesheet" href="style.css">
    <!-- 第三方库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>
<div class="app">
    <div class="toolbar">
        <div class="logo"><i class="fas fa-book-open"></i>Zero. Zip. Xplore.</div>
        <label class="file-label">
            <i class="fas fa-upload"></i><span> 上传图书</span>
            <input type="file" id="fileInput" accept=".epub,.pdf,.txt" style="display: none;">
        </label>
        <div class="url-input">
            <input type="text" id="bookUrl" placeholder="图书URL (支持 .epub/.pdf/.txt)" value="">
            <button id="loadUrlBtn"><i class="fas fa-link"></i> 加载</button>
        </div>
        <div class="ctrl-group">
            <button class="btn-icon" id="fontMinusBtn" title="减小字号"><i class="fas fa-font"></i><span>-</span></button>
            <button class="btn-icon" id="fontPlusBtn" title="增大字号"><i class="fas fa-font"></i><span>+</span></button>
            <button class="btn-icon" id="themeToggleBtn" title="日夜模式"><i class="fas fa-moon"></i></button>
            <button class="btn-icon" id="smartChapterBtn" title="智能章节(TXT)"><i class="fas fa-code-branch"></i><span> 智能章</span></button>
            <button class="btn-icon" id="toggleSidebarBtn" title="目录"><i class="fas fa-list-ul"></i></button>
        </div>
    </div>
    <div class="main-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><i class="fas fa-table-of-contents"></i> 目录 / 章节</div>
            <ul class="toc-list" id="tocList">
                <li style="padding: 20px; text-align: center; color: gray;">暂无书籍，上传后显示目录</li>
            </ul>
        </aside>
        <div class="reader-container" id="readerContainer">
            <div id="readerArea" class="reader-area-inner">
                <div class="empty-state">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 48px; opacity: 0.5;"></i>
                    <p style="margin-top: 16px;">支持 EPUB / PDF / TXT<br>拖拽或点击上传，大文本智能分章</p>
                </div>
            </div>
        </div>
    </div>
</div>
<div id="loadingToast" class="loading-overlay" style="display: none;">加载中...</div>
<div id="chapterNavBar" class="chapter-nav" style="display: none;">
    <button id="prevChapterBtn"><i class="fas fa-chevron-left"></i> 上一章</button>
    <span id="chapterInfo">章节导航</span>
    <button id="nextChapterBtn">下一章 <i class="fas fa-chevron-right"></i></button>
</div>

<!-- 外部脚本 -->
<script src="script.js"></script>
</body>
</html>
