<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ZZX · 电子书阅读器</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script></head><body><div class="app"><div class="status-bar"><span id="bookTitle">未打开书籍</span><span id="batteryTime">100% · 12:00</span></div><div class="reader-container" id="readerContainer"><div id="readerArea" class="reader-inner"><div class="empty-state"><i class="fas fa-cloud-upload-alt" style="font-size:48px;opacity:0.4"></i><p>点击任意位置<br>上传图书开始阅读</p></div></div></div><div class="toolbar-overlay" id="toolbarOverlay" style="display:none"><div class="toolbar-panel"><div class="search-row"><input type="text" id="searchInput" placeholder="搜索全书..." autocomplete="off"><button id="clearSearchBtn" class="icon-btn search-clear-btn"><i class="fas fa-times"></i></button><div class="search-dropdown" id="searchDropdown" style="display:none"><div class="search-section local"><h4>本页</h4><ul id="localMatchList"></ul></div><div class="search-section global"><h4>全文</h4><ul id="globalMatchList"></ul></div></div></div><div class="tools-grid"><label class="tool-btn"><i class="fas fa-upload"></i><span>上传</span><input type="file" id="fileInput" accept=".epub,.pdf,.txt" style="display:none"></label><button class="tool-btn" id="urlLoadBtn"><i class="fas fa-link"></i><span>URL</span></button><button class="tool-btn" id="fontMinusBtn"><i class="fas fa-font"></i><span>A-</span></button><button class="tool-btn" id="fontPlusBtn"><i class="fas fa-font"></i><span>A+</span></button><button class="tool-btn" id="themeToggleBtn"><i class="fas fa-moon"></i><span>夜间</span></button><button class="tool-btn" id="smartChapterBtn"><i class="fas fa-code-branch"></i><span>章节</span></button><button class="tool-btn" id="tocBtn"><i class="fas fa-list-ul"></i><span>目录</span></button></div></div></div><div class="sidebar-mask" id="sidebarMask" style="display:none"></div><div class="sidebar" id="sidebar"><div class="sidebar-header"><span>目录</span><button class="icon-btn" id="closeSidebarBtn"><i class="fas fa-times"></i></button></div><ul class="toc-list" id="tocList"><li class="empty-toc">暂无书籍</li></ul></div></div><script src="script.js"></script></body></html>
